---
name: Client
permissions:
  contents: read

on:
  push:
    branches: ['**']
    tags: ['sloplight-v*']
    paths:
      - client/**
      - moonlight-common-c/**
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/client*
  pull_request:
    branches:
      - master
    paths:
      - client/**
      - moonlight-common-c/**
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/client*

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.set-ci-version.outputs.ci_version }}
    steps:
      - name: Set CI version
        id: set-ci-version
        shell: bash
        run: |
          CI_VERSION=`echo ${GITHUB_SHA} | cut -c1-6`
          echo "ci_version=${CI_VERSION}" >> "${GITHUB_OUTPUT}"

  build-appimage:
    needs: setup
    uses: ./.github/workflows/client-appimage.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  build-steamlink:
    needs: setup
    uses: ./.github/workflows/client-steamlink.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  build-windows-macos:
    needs: setup
    uses: ./.github/workflows/client-win-mac.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  # Moonlight's own tags are v0.1.0…v6.x, so Sloplight releases use their own prefix.
  release-sloplight:
    needs: build-windows-macos
    if: startsWith(github.ref, 'refs/tags/sloplight-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Sloplight-macos-arm64

      - uses: softprops/action-gh-release@v2
        with:
          files: Sloplight-macos-arm64.zip
