---
name: Client
permissions:
  contents: read

on:
  push:
    branches: ['**']
    tags: ['sloplight-v*']
    paths:
      - client/**
      - moonlight-common-c/**
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/client*
  pull_request:
    branches:
      - master
    paths:
      - client/**
      - moonlight-common-c/**
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/client*
  workflow_dispatch:

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-2025
            qt_version: 6.12.0
          # macOS
          - os: macos-26
            qt_version: 6.11.2

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set CI version
        shell: bash
        run: echo "CI_VERSION=${GITHUB_SHA::6}" >> "$GITHUB_ENV"

      - name: Download dependencies (Windows)
        if: runner.os == 'Windows'
        run: powershell ./setup-deps.ps1

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install node
          npm install --global create-dmg

      - name: Install Rust (macOS)
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo (macOS)
        if: runner.os == 'macOS'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/sloplight

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: ${{ runner.os != 'Windows' }}
          add-tools-to-path: ${{ runner.os != 'Windows' }}
          tools: ${{ runner.os == 'Windows' && 'tools_qtcreator_gui' || '' }}
          version: ${{ matrix.qt_version }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Install Qt ARM64 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: false
          add-tools-to-path: false
          arch: win64_msvc2022_arm64_cross_compiled
          version: ${{ matrix.qt_version }}

      - name: Build x64 binaries (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release x64
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\${{ matrix.qt_version }}\msvc2022_64\bin

      - name: Build ARM64 binaries (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release arm64
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\${{ matrix.qt_version }}\msvc2022_arm64\bin

      - name: Build Package
        shell: pwsh
        run: |
          if ($Env:RUNNER_OS -eq "Windows") {
            cmd /c scripts\generate-bundle.bat Release
          } else {
            bash scripts/generate-dmg.sh Release
          }

      - name: Upload Binaries (Windows x64)
        uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: Moonlight-${{ runner.os }}-x64-${{ env.CI_VERSION }}
          path: client/build/deploy-x64-release/*
          if-no-files-found: error

      - name: Upload Binaries (Windows arm64)
        uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: Moonlight-${{ runner.os }}-arm64-${{ env.CI_VERSION }}
          path: client/build/deploy-arm64-release/*
          if-no-files-found: error

      - name: Upload Binaries (macOS)
        uses: actions/upload-artifact@v6
        if: runner.os == 'macOS'
        with:
          name: Moonlight-${{ runner.os }}-${{ env.CI_VERSION }}
          path: client/build/installer-Release/*.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Upload Symbols
        uses: actions/upload-artifact@v6
        with:
          name: zDevDbgSyms-${{ runner.os }}-${{ env.CI_VERSION }}
          path: |
            client/build/installer-*/*.dsym/*
            client/build/symbols-*/*.pdb
          if-no-files-found: error

      - name: Build Sloplight.app (macOS)
        if: runner.os == 'macOS'
        working-directory: client/sloplight
        run: HELPER_SRC=../build/build-Release/app/Moonlight.app ./scripts/bundle-macos.sh
        env:
          # gpui needs macOS 12+, the helper declares 13.0 in its Info.plist.
          MACOSX_DEPLOYMENT_TARGET: "13.0"

      - name: Package Sloplight (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent sloplight/target/Sloplight.app "Sloplight-macos-arm64.zip"
          shasum -a 256 "Sloplight-macos-arm64.zip" | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'The app is ad-hoc signed and not notarized: after unzipping, run `xattr -dr com.apple.quarantine Sloplight.app` or right-click → Open the first time.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Sloplight (macOS)
        uses: actions/upload-artifact@v6
        if: runner.os == 'macOS'
        with:
          name: Sloplight-macos-arm64
          path: client/Sloplight-macos-arm64.zip
          if-no-files-found: error

  # Moonlight's own tags are v0.1.0…v6.x, so Sloplight releases use their own prefix.
  release-sloplight:
    needs: build
    if: startsWith(github.ref, 'refs/tags/sloplight-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Sloplight-macos-arm64

      - uses: softprops/action-gh-release@v2
        with:
          files: Sloplight-macos-arm64.zip
