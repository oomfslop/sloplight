name: Sloplight (macOS)

on:
  push:
    branches: [master]
    # Moonlight's own tags are v0.1.0…v6.x, so Sloplight releases use their own prefix.
    tags: ["sloplight-v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag or commit); defaults to the selected branch"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sloplight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS arm64
    runs-on: macos-26
    env:
      # gpui needs macOS 12+, the helper declares 13.0 in its Info.plist.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install create-dmg
        run: npm install --global create-dmg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          version: 6.11.2
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sloplight

      # Self-contained (macdeployqt): a Nix build only runs where its store paths exist
      - name: Build the streaming helper
        run: bash scripts/generate-dmg.sh Release

      - name: Build and bundle Sloplight.app
        working-directory: sloplight
        run: HELPER_SRC=../build/build-Release/app/Moonlight.app ./scripts/bundle-macos.sh

      - name: Package
        run: |
          ditto -c -k --keepParent sloplight/target/Sloplight.app "Sloplight-macos-arm64.zip"
          shasum -a 256 "Sloplight-macos-arm64.zip" | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'The app is ad-hoc signed and not notarized: after unzipping, run `xattr -dr com.apple.quarantine Sloplight.app` or right-click → Open the first time.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sloplight-macos-arm64
          path: Sloplight-macos-arm64.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/sloplight-v')
        uses: softprops/action-gh-release@v2
        with:
          files: Sloplight-macos-arm64.zip
