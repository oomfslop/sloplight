// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.21'
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.4.21'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url = uri("https://jitpack.io") }
    }
}

// Aggregate all variant/unit tests under the root `test` task
gradle.projectsEvaluated {
    def agg = tasks.findByName('test') ?: tasks.register('test') {
        group = 'verification'
        description = 'Runs every unit-test task in all sub-projects'
    }

    // (only the Test tasks are created for this, not every task: AGP 9 can't
    // create some, such as the Compose preview ones of variants without tests)
    subprojects.each { p ->
        agg.configure { dependsOn p.tasks.withType(Test).matching { it.name.endsWith('UnitTest') } }
    }
}

subprojects { subProj ->
    subProj.tasks.withType(Test).configureEach {
        // Always execute tests; bypass up-to-date checks
        outputs.upToDateWhen { false }

        // Verbose console output for test status
        testLogging {
            events "passed", "failed", "skipped"
            exceptionFormat "full"
            showStandardStreams = true
        }
    }
}
